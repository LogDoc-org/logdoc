name: logdoc-dev

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: logdoc-clickhouse
    ports:
      - "8124:8123"   # HTTP (8123 on the host is often taken by another CH)
      - "9010:9000"   # native
    environment:
      CLICKHOUSE_DB: logdoc
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka for testing the notification channel: profile `test` only.
  # docker compose -f deploy/docker-compose.dev.yml --profile test up -d
  # The image defaults to a single KRaft node advertised as localhost:9092.
  kafka:
    image: apache/kafka:3.9.0
    container_name: logdoc-kafka
    profiles: ["test"]
    ports:
      - "9092:9092"

volumes:
  clickhouse-data:
